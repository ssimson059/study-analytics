<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Assistant</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
<header>
  <div class="icon">AI</div>
  <div><h1>Study Assistant</h1><p>Education Chatbot</p></div>
  <span class="online">● Online</span>
</header>
<section id="chat" class="chat">
  <div class="msg bot">Hi! I'm your <b>Study Assistant</b>. How can I help you?</div>
</section>
<form id="chatForm">
  <input id="message" placeholder="Type your message..." autocomplete="off" required>
  <button type="submit">Send</button>
</form>
<footer>Powered by Gemini • Render Ready</footer>
</div>
<script src="script.js"></script>
</body>
</html>
